version: '3.8'

services:
  pregnancy_health:
    build: .
    container_name: pregnancy_health
    restart: unless-stopped
    ports:
      - "5001:5002"
    volumes:
      - ./data:/data
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/pregnancy.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
